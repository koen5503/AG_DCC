# PlatformIO Project Configuration File
#
# For more information and options, please visit:
# https://docs.platformio.org/page/projectconf.html

[platformio]
# Direct PlatformIO to build using the standard ESP-IDF directory layout
src_dir = main

# =============================================================================
# Common Configurations for all Environments
# =============================================================================
[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
board_build.partitions = huge_app.csv

# =============================================================================
# Environment 1: Standard ESP32 (Xtensa Dual-Core)
# =============================================================================
[env:esp32dev]
board = esp32dev
# Note: For standard ESP32, DCC_GPIO_PIN in app_main.cpp defaults to GPIO 21

# =============================================================================
# Environment 2: ESP32-C3 (RISC-V Single-Core)
# =============================================================================
[env:esp32c3]
board = esp32-c3-devkitm-1
# Note: For ESP32-C3, DCC_GPIO_PIN in app_main.cpp defaults to GPIO 8
# You can route console logging through USB-Serial-JTAG by configuring
# menuconfig: pio run -t menuconfig -> Component Config -> ESP System Settings

# =============================================================================
# Environment 3: ESP32-S3 (Xtensa Dual-Core with USB/Vector Instructions)
# =============================================================================
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.maximum_size = 4194304
board_upload.maximum_size = 4194304
# Note: For ESP32-S3, DCC_GPIO_PIN in app_main.cpp defaults to GPIO 18
